name: Sugerir recurso
description: Proponha um recurso ou melhoria com um caso de uso claro.
labels: [enhancement]
body:
  - type: markdown
    attributes:
      value: |
        Para conectar plataformas que este repositório não coleta diretamente, veja o [guia de fontes](https://github.com/danjustino/myhot-br/blob/pt-br-tecnologia/docs/sources.md), que explica como enviar resultados de uma coleta externa.
        Um recurso que só o seu site precisa pode virar um módulo em `modules/` no seu próprio repositório; veja a [arquitetura](https://github.com/danjustino/myhot-br/blob/pt-br-tecnologia/docs/architecture.md#módulos).
  - type: textarea
    id: problem
    attributes:
      label: Caso de uso e problema
      description: Quem precisa disso e em que situação? O que está difícil hoje?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Como você gostaria que melhorasse
      description: Descreva o comportamento ou o resultado esperado; exemplos concretos ajudam.
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: O que você já tentou (opcional)
      description: Por que a configuração atual, um script ou outra solução não resolve?
