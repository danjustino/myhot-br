name: Relatar bug
description: Relate uma falha reproduzível para ajudar a encontrar e corrigir.
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Falhas de segurança devem ser enviadas pelo [relatório privado de vulnerabilidade](https://github.com/danjustino/myhot-br/security/advisories/new).
        Não envie o .env completo, chaves de API, a senha do admin, cookies nem o banco de produção.
  - type: input
    id: revision
    attributes:
      label: Versão do código
      description: Rode git rev-parse --short HEAD na pasta do repositório; se não souber, diga a data em que baixou ou atualizou.
      placeholder: Hash do commit, ou a data em que baixou ou atualizou
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: Ambiente
      description: Sistema, Docker ou instalação direta, versões relevantes; para problemas no site, informe o navegador.
      placeholder: Ubuntu / macOS / Windows; Docker Compose / Node.js; se há proxy reverso; se mudou alguma configuração relacionada.
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Passos para reproduzir
      description: A partir de qual página, comando ou ação? Informe os passos mínimos que reproduzem o problema.
      placeholder: |
        1. Abrir…
        2. Executar…
        3. Aparece…
    validations:
      required: true
  - type: textarea
    id: expected-actual
    attributes:
      label: Resultado esperado e resultado real
      placeholder: Esperado…; real…
    validations:
      required: true
  - type: textarea
    id: evidence
    attributes:
      label: Logs ou capturas de tela (opcional)
      description: Cole só o trecho relevante e tire chaves, senhas, cookies e dados pessoais antes de enviar; dá para enviar sem logs.
